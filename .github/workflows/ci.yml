name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true

      - name: Lint
        run: pnpm lint --format=github

      - name: Format
        run: pnpm format:check

      - name: Audit
        run: pnpm audit --prod

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
        mongo: ["7.0", "8.0", "8.3", "9.0"]
        include:
          - node: 26
            mongo: "9.0"
            coverage: true

    # Official images by minor tag, not digest: Dependabot does not update
    # digests under `services:`, and a digest nobody moves stops testing the
    # server patches users actually run.
    services:
      mongo:
        image: mongo:${{ matrix.mongo }}
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 25
          --health-start-period 20s

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@${{ matrix.node }}
          cache: true

      - name: Test
        run: pnpm ${{ matrix.coverage && 'coverage' || 'test' }}

      - name: Coverage
        if: ${{ matrix.coverage }}
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: coverage/lcov.info
          format: lcov
          fail-on-error: false
